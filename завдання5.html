<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8"> 
  <title>Лабораторна робота 2 — Завдання 5</title>
</head>
<body>
  <h3>Лабораторна робота 2 — Завдання 5</h3>
  <p>Результати виводяться в консоль (F12 → Console)</p>
  <script>
    const cars = [
      { id: "A-001", plate: "AT 1234 BK", brand: "MAN TGS",       capacity: 18, fuelPer100: 32.5 },
      { id: "A-002", plate: "AT 5678 CM", brand: "Volvo FH16",    capacity: 25, fuelPer100: 35.0 },
      { id: "A-003", plate: "AT 9012 HP", brand: "Mercedes Atego", capacity: 8,  fuelPer100: 21.4 },
      { id: "A-004", plate: "AT 3456 EI", brand: "DAF XF",        capacity: 20, fuelPer100: 30.8 },
    ];

    console.log("Завдання 5. Інформація про кожен автомобіль (for...of):");
    for (const car of cars) {
      console.log(
        `[${car.id}] ${car.brand}, номер: ${car.plate}, ` +
        `вантажність: ${car.capacity} т, витрата: ${car.fuelPer100} л/100 км`
      );
    }

    console.log("Те саме через forEach:");
    cars.forEach((car, index) => {
      console.log(`${index + 1}. ${car.brand} (${car.plate})`);
    });
  </script>
</body>
</html>
